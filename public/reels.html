<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bazaar Reels — short videos from shops near you</title>
<meta name="description" content="Watch short reels from cafés, kirana stores, bakeries and shops near you on Bazaar Buzz. Like, comment, rate places and grab their deals.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<script src="/transition.js" defer></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta property="og:title" content="Bazaar Reels — Bazaar Buzz">
<meta property="og:description" content="Short videos from shops near you. Like, comment and grab their deals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#DB8B66;--acc2:#A84E2C;--text:#fff;--muted:rgba(255,255,255,.72);--dim:rgba(255,255,255,.5);
  --sheet:#1C1C1A;--sheet2:#262624;--line:rgba(255,255,255,.1);--ease:cubic-bezier(.2,.8,.2,1);
  --safe-b:env(safe-area-inset-bottom,0px);--nav:60px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- layout ---------- */
.app{height:100dvh;display:grid;grid-template-columns:1fr;position:relative}
.side{display:none}
.stage{position:relative;height:100dvh;display:flex;justify-content:center;align-items:center}
.feed{position:relative;height:100%;width:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.feed::-webkit-scrollbar{display:none}

/* ---------- top bar ---------- */
.top{position:absolute;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 30px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.top>*{pointer-events:auto}
.tbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.tbtn:hover{background:rgba(255,255,255,.12)}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:4px;position:relative}
.tab{position:relative;z-index:1;padding:7px 14px;border-radius:999px;font-size:.86rem;font-weight:600;color:var(--muted);transition:color .25s}
.tab.on{color:#111}
.tab{white-space:nowrap}
@media (max-width:370px){.tab{padding:7px 10px;font-size:.8rem}.top{padding-left:8px;padding-right:8px}.tbtn{width:34px}.badge{display:none}.hint{left:12px;transform:none;font-size:.74rem}}
.tab-pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:#fff;transition:left .35s var(--ease),width .35s var(--ease)}

/* ---------- slide ---------- */
.slide{position:relative;height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#0b0b0a}
.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.slide .shade{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.78));pointer-events:none}
.tapzone{position:absolute;inset:0;z-index:2}
.pp{position:absolute;left:50%;top:50%;z-index:3;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(0,0,0,.42);display:grid;place-items:center;opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.pp svg.i{width:34px;height:34px;fill:#fff;stroke:none}
.slide.paused .pp{opacity:1;transform:scale(1)}
.burst{position:absolute;z-index:6;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;color:#ff3b5c}
.burst svg.i{width:100%;height:100%;fill:currentColor;stroke:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.4))}

/* right rail */
.rail{position:absolute;right:10px;bottom:calc(var(--nav) + var(--safe-b) + 18px);z-index:5;display:grid;gap:18px;justify-items:center}
.act{display:grid;justify-items:center;gap:4px;font-size:.76rem;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.act .ic{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;transition:transform .15s}
.act:active .ic{transform:scale(.86)}
.act svg.i{width:29px;height:29px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.act.liked svg.i{fill:#ff3b5c;stroke:#ff3b5c}
.act.saved svg.i{fill:#fff}
.disc{width:34px;height:34px;border-radius:9px;border:2px solid #fff;display:grid;place-items:center;font-weight:700;font-size:.8rem;overflow:hidden}
.slide.playing .disc{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* bottom info */
.info{position:absolute;left:0;right:72px;bottom:calc(var(--nav) + var(--safe-b) + 14px);z-index:5;padding:0 14px;display:grid;gap:9px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none;border:1.5px solid rgba(255,255,255,.85);color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.badge{font-size:.66rem;font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);white-space:nowrap}
.follow{padding:5px 12px;border:1.5px solid rgba(255,255,255,.85);border-radius:9px;font-size:.8rem;font-weight:700;transition:background .2s,color .2s;white-space:nowrap}
.follow.on{background:rgba(255,255,255,.18);border-color:transparent}
.cap{font-size:.9rem;line-height:1.42;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;overflow-wrap:anywhere}
.cap.open{-webkit-line-clamp:unset;max-height:40vh;overflow:auto}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:.78rem;font-weight:600;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);max-width:100%}
.chip svg.i{width:15px;height:15px}
.chip.deal{background:var(--acc);border-color:transparent;color:#1a0f0a}
.chip.star svg.i{fill:#FFC34D;stroke:#FFC34D}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.audio{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);overflow:hidden;white-space:nowrap}
.audio svg.i{width:15px;height:15px}
.audio .mq{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,#000 80%,transparent)}
.audio .mq span{display:inline-block;padding-right:40px}
.slide.playing .audio .mq span{animation:mq 9s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.prog{position:absolute;left:0;right:0;bottom:calc(var(--nav) + var(--safe-b));height:2px;background:rgba(255,255,255,.18);z-index:6}
.prog i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;transform:scaleX(0)}

/* mute chip */
.mute{position:absolute;right:14px;top:calc(64px + env(safe-area-inset-top,0px));z-index:7;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.mute svg.i{width:18px;height:18px}
.hint{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:7;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.55);font-size:.8rem;font-weight:600;display:flex;gap:7px;align-items:center;white-space:nowrap}
.hint svg.i{width:16px;height:16px}

/* bottom nav */
.nav{position:absolute;inset:auto 0 0 0;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);z-index:20;background:#000;border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav a,.nav button{display:grid;justify-items:center;gap:3px;font-size:.64rem;color:var(--dim);font-weight:600}
.nav .on{color:#fff}
.nav svg.i{width:25px;height:25px}
.nav .plus .ic{width:42px;height:30px;border-radius:9px;display:grid;place-items:center;background:#fff;color:#000}
.nav .plus svg.i{width:20px;height:20px;stroke-width:2.6}

/* empty + loader */
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted);scroll-snap-align:start}
.empty>div>svg.i{width:46px;height:46px;color:var(--muted)}
.empty h3{font-family:Fraunces,serif;color:#fff;font-size:1.4rem;margin:12px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:700;background:var(--acc);color:#1a0f0a;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--sheet2);color:#fff}
.skel{height:100%;display:grid;place-items:center;scroll-snap-align:start}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;left:50%;bottom:0;width:min(100%,520px);max-height:78dvh;transform:translate(-50%,105%);background:var(--sheet);border-radius:20px 20px 0 0;display:flex;flex-direction:column;transition:transform .38s var(--ease);padding-bottom:var(--safe-b)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:9px;background:rgba(255,255,255,.25);margin:9px auto 4px}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 12px;border-bottom:1px solid var(--line)}
.sh-head h3{font-size:1rem;font-weight:700}
.sh-body{overflow-y:auto;padding:12px 16px;flex:1;min-height:120px}
.cm{display:flex;gap:11px;padding:9px 0}
.cm .av{width:32px;height:32px;font-size:.8rem;border:0}
.cm .meta{font-size:.78rem;color:var(--dim)}
.cm .meta b{color:#fff;margin-right:6px}
.cm p{font-size:.9rem;line-height:1.4;margin-top:2px;overflow-wrap:anywhere}
.cm .del{margin-left:auto;color:var(--dim);align-self:flex-start;padding:4px}
.cm .del svg.i{width:16px;height:16px}
.muted{color:var(--dim);font-size:.88rem;text-align:center;padding:24px 0}
.composer{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.inp{width:100%;background:var(--sheet2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:#fff;font:inherit;font-size:.92rem;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:none;min-height:70px}
.send{width:42px;height:42px;border-radius:12px;background:var(--acc);color:#1a0f0a;display:grid;place-items:center;flex:none}
.send svg.i{width:19px;height:19px}
.share-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:18px 16px 22px}
.share-row button,.share-row a{display:grid;justify-items:center;gap:7px;font-size:.76rem;color:var(--muted)}
.share-row .ic{width:52px;height:52px;border-radius:50%;background:var(--sheet2);display:grid;place-items:center;color:#fff}
.field{display:grid;gap:6px;margin-bottom:13px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.drop{border:1.5px dashed rgba(255,255,255,.25);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:.88rem;cursor:pointer;display:grid;gap:8px;justify-items:center}
.drop video{width:120px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#000}
.stars{display:flex;gap:6px}
.stars button svg.i{width:30px;height:30px;color:#777}
.stars button.on svg.i{fill:#FFC34D;stroke:#FFC34D}
.err{color:#F08070;font-size:.84rem;min-height:1.2em;margin-bottom:8px}
.bar{height:6px;border-radius:9px;background:var(--sheet2);overflow:hidden;margin-bottom:10px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 18px);z-index:90;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;transition:all .3s var(--ease);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- desktop ---------- */
@media (min-width:900px){
  :root{--nav:0px}
  .app{grid-template-columns:240px 1fr 120px;background:#0d0d0c}
  .side{display:flex;flex-direction:column;gap:6px;padding:26px 16px;border-right:1px solid rgba(255,255,255,.07)}
  .logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:1.3rem;font-weight:700;padding:4px 10px 24px}
  .logo .mk{width:34px;height:34px;border-radius:10px;background:var(--acc2);display:grid;place-items:center}
  .logo .mk svg.i{width:19px;height:19px;color:#fff}
  .side a,.side button{display:flex;align-items:center;gap:14px;padding:12px 12px;border-radius:12px;font-weight:600;color:var(--muted);transition:background .2s,color .2s;text-align:left}
  .side a:hover,.side button:hover{background:rgba(255,255,255,.07);color:#fff}
  .side .on{color:#fff;background:rgba(255,255,255,.07)}
  .side .grow{flex:1}
  .side .me{font-size:.85rem}
  .stage{padding:18px 0}
  .feed{height:calc(100dvh - 36px);width:auto;aspect-ratio:9/16;max-width:100%;border-radius:18px;box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}
  .top{position:absolute;left:50%;right:auto;width:min(calc((100dvh - 36px)*9/16),100%);transform:translateX(-50%);top:18px;border-radius:18px 18px 0 0;justify-content:center}
  .top .tbtn{display:none}
  .mute{right:calc(50% - (100dvh - 36px)*9/32 + 14px)}
  .nav{display:none}
  .rnav{display:flex!important;flex-direction:column;justify-content:center;gap:12px;padding-left:10px}
  .rnav button{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;transition:background .2s}
  .rnav button:hover{background:rgba(255,255,255,.16)}
  .toast{bottom:30px}
  .hint{top:84px}
}
.rnav{display:none}

/* ---- interactive reels: captions, hotspots, transcript, scrubbing ---- */
.cc{position:absolute;left:14px;right:74px;top:55%;z-index:5;text-align:center;pointer-events:none;transition:opacity .25s}
.cc .line{display:inline;font-weight:700;font-size:1.06rem;line-height:1.55;padding:5px 11px;border-radius:10px;background:rgba(0,0,0,.58);-webkit-box-decoration-break:clone;box-decoration-break:clone;color:rgba(255,255,255,.62)}
.cc .w{transition:color .12s}
.cc .w.on{color:#fff}
.cc .w.now{color:#FFD27A}
.no-cc .cc{opacity:0}
.ccbtn{position:absolute;right:14px;top:calc(108px + env(safe-area-inset-top,0px));z-index:7;height:32px;padding:0 9px;border-radius:9px;background:rgba(0,0,0,.45);display:flex;align-items:center;gap:5px;font-size:.72rem;font-weight:800;letter-spacing:.04em}
.ccbtn svg.i{width:17px;height:17px}
.ccbtn.off{opacity:.55}
.ccbtn.off::after{content:'';position:absolute;left:6px;right:6px;top:50%;height:2px;background:#fff;transform:rotate(-20deg)}
.hs{position:absolute;z-index:6;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.hs.show{opacity:1;transform:scale(1);pointer-events:auto}
.hs::before{content:'';position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.35);animation:hsP 1.6s ease-out infinite}
.hs i{position:relative;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:grid;place-items:center}
.hs i::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc2)}
.hs.coupon,.hs.coupon.show{width:74%;height:25%;margin:0;border-radius:24px;opacity:1;transform:translate(-50%,-50%)}
.hs.coupon::before,.hs.coupon i{display:none}
@keyframes hsP{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
.hcard{position:absolute;z-index:8;width:min(270px,78%);background:#FFFDF8;color:#1F1E1B;border-radius:16px;padding:14px 14px 12px;box-shadow:0 18px 40px -12px rgba(0,0,0,.6)}
.hcard .k{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2);display:flex;align-items:center;gap:5px}
.hcard .k svg.i{width:13px;height:13px}
.hcard b{display:block;font-size:1.05rem;margin:5px 0 2px}
.hcard p{font-size:.84rem;color:#5E5B55;line-height:1.35}
.hcard .code{margin:10px 0 2px;border:1.5px dashed var(--acc2);border-radius:11px;padding:9px;text-align:center;font:800 1.15rem/1 Inter,system-ui;letter-spacing:.08em;color:var(--acc2);background:rgba(168,78,44,.06)}
.hcard .row{display:flex;gap:8px;margin-top:11px}
.hcard .row a,.hcard .row button{flex:1;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.84rem;background:#F1EFEA;color:#1F1E1B}
.hcard .row .pri{background:var(--acc2);color:#fff}
.hcard .row svg.i{width:15px;height:15px}
.hcard .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#8C8880}
.hcard .x svg.i{width:16px;height:16px}
.prog{height:3px;cursor:pointer;touch-action:none}
.prog::before{content:'';position:absolute;left:0;right:0;top:-14px;bottom:-8px}
.prog .knob{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transform:scale(0);transition:transform .15s;left:0}
.slide.scrub .prog{height:6px}.slide.scrub .prog .knob,.prog:hover .knob{transform:scale(1)}
.ptime{position:absolute;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 22px);transform:translateX(-50%);z-index:8;font-weight:800;font-size:1.4rem;text-shadow:0 2px 8px rgba(0,0,0,.6);opacity:0;transition:opacity .2s;pointer-events:none}
.slide.scrub .ptime{opacity:1}
.tx-head{display:flex;align-items:center;gap:10px}
.lang{display:flex;background:var(--sheet2);border-radius:9px;padding:3px;margin-left:auto}
.lang button{padding:5px 10px;border-radius:7px;font-size:.76rem;font-weight:700;color:var(--muted)}
.lang button.on{background:#fff;color:#111}
.txl{display:flex;gap:12px;padding:10px 8px;border-radius:12px;width:100%;text-align:left;transition:background .2s}
.txl:hover{background:rgba(255,255,255,.05)}
.txl time{flex:none;font-size:.78rem;font-weight:700;color:var(--acc);padding-top:2px;min-width:34px}
.txl span{font-size:.95rem;line-height:1.45;color:var(--muted)}
.txl.on{background:rgba(219,139,102,.12)}.txl.on span{color:#fff}
.tx-note{font-size:.78rem;color:var(--dim);padding:6px 8px 0}
@media (min-width:900px){.ccbtn{right:calc(50% - (100dvh - 36px)*9/32 + 14px);top:106px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol><symbol id="i-volume-2" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></symbol><symbol id="i-volume-x" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol><symbol id="i-captions" viewBox="0 0 24 24"><rect width="18" height="14" x="3" y="5" rx="2" ry="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol><symbol id="i-tag" viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></symbol></defs></svg>
<div class="app">

    <a class="logo" href="/"><span class="mk"><svg class="i"><use href="#i-store"/></svg></span>Bazaar Buzz</a>

  <main class="stage">

  <div class="sh-body">
    <div class="field"><label class="drop" id="pDrop"><input type="file" id="pFile" accept="video/mp4,video/webm,video/quicktime" class="sr"><svg class="i"><use href="#i-upload"/></svg><span id="pFileTxt">Choose a video (MP4, WebM or MOV, up to 30 MB)</span><video id="pPrev" muted playsinline loop style="display:none"></video></label></div>

    <div class="bar" id="pBar"><i></i></div>

    <button class="btn" id="pGo" style="width:100%">Share reel</button>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/motion@14.14.0/dist/motion.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=(n)=>`<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=window.Motion||null;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1e3?(n/1e3).toFixed(1).replace('.0','')+'K':String(n||0);
const slug=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
const HUES=['#A84E2C','#2E6A55','#8F5410','#5B4B8A','#2D5F8B','#8A3B5B','#6B6B2E'];
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return HUES[h%HUES.length]};
const ago=d=>{const s=(Date.now()-new Date(d))/1e3;return s<60?'now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}

const SAMPLES=[
  {id:'s-chai',src:'reels/chai.mp4',poster:'reels/chai.jpg',shop:'Sharma Chai Point',cat:'Café',role:'business',by:'Sharma Chai Point',caption:'Garma garam chai sirf ₹10 mein ☕ Buy 2 get 1 FREE every evening!',offer:'2+1 free chai'},
  {id:'s-bakery',src:'reels/bakery.mp4',poster:'reels/bakery.jpg',shop:'Sweet Crumbs Bakery',cat:'Bakery',role:'business',by:'Sweet Crumbs Bakery',caption:'Fresh pastries daily 🧁 Buy 1 Get 1 FREE after 7 PM',offer:'Buy 1 get 1 on pastries'},
  {id:'s-mango',src:'reels/mango.mp4',poster:'reels/mango.jpg',shop:'Fresh Fruit Corner',cat:'Fruits',role:'business',by:'Fresh Fruit Corner',caption:'Alphonso aam aa gaye! 🥭 Seedha farm se, ₹80/kg today only',offer:'Mangoes ₹80/kg'},
  {id:'s-mobile',src:'reels/mobile.mp4',poster:'reels/mobile.jpg',shop:'MobileCare Point',cat:'Electronics',role:'business',by:'MobileCare Point',caption:'Phone repair in 30 min 📱 Free screen guard with every repair',offer:'Screen guard free'},
  {id:'s-kirana',src:'reels/kirana.mp4',poster:'reels/kirana.jpg',shop:'Gupta Kirana Store',cat:'Kirana',role:'business',by:'Gupta Kirana Store',caption:'Ghar ka saara saaman, ek jagah 🛒 Free home delivery on ₹500+',offer:'Free delivery ₹500+'},
  {id:'s-kurta',src:'reels/kurta.mp4',poster:'reels/kurta.jpg',shop:'Trendz Fashion Hub',cat:'Fashion',role:'business',by:'Trendz Fashion Hub',caption:'Wedding season sale 👗 All kurtas 40% OFF this week',offer:'Flat 40% off kurtas'}
];

/* ---------- state ---------- */
const S={on:false,token:store.get('pp_token',null),me:null,reels:[],likes:{},comments:{},reviews:[],filter:'all',list:[],cur:0,
  muted:store.get('bb_muted',true),saved:new Set(store.get('bb_saved',[])),follows:new Set(store.get('bb_follows',[]))};
async function api(path,body,method){
  const r=await fetch('/api'+path,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Something went wrong');e.status=r.status;throw e}return j;
}
async function boot(){
  try{const c=new AbortController();setTimeout(()=>c.abort(),3000);const r=await fetch('/api/health',{signal:c.signal});S.on=r.ok&&(await r.json()).ok}catch(e){S.on=false}
  if(S.on){
    const [me,rl,rv]=await Promise.allSettled([S.token?api('/me'):Promise.reject(),api('/reels'),api('/reviews')]);
    if(me.status==='fulfilled')S.me=me.value.user;else if(S.token&&me.reason&&me.reason.status===401){S.token=null;store.set('pp_token',null)}
    if(rl.status==='fulfilled'){S.reels=rl.value.reels||[];S.likes=rl.value.likes||{};S.comments=rl.value.comments||{}}
    if(rv.status==='fulfilled')S.reviews=rv.value.reviews||[];
  }
  renderMe();build(true);
}
function renderMe(){
  const n=S.me?S.me.name.split(' ')[0]:'Log in';
  for(const el of [$('#navMe'),$('#sideMe')]){el.querySelector('span').textContent=n;el.href=S.me?'/me':'/?auth=login'}
}
const all=()=>[...S.reels,...SAMPLES];
const prof=r=>r.uid?'/u/'+encodeURIComponent(r.uid):'/u/'+encodeURIComponent(r.id);
function rating(shop){const k=slug(shop),l=S.reviews.filter(v=>v.place===k);return l.length?{avg:l.reduce((a,v)=>a+v.rating,0)/l.length,n:l.length}:null}

/* ---------- build feed ---------- */
let io;
function build(first){
  const feed=$('#feed');
  S.list=all().filter(r=>S.filter==='all'||r.role===S.filter);
  if(!S.list.length){feed.innerHTML=`<div class="empty"><div>${ic('clapperboard')}<h3>No reels here yet</h3><p>Be the first to post one.</p><br><button class="btn" data-post>${ic('plus')} Post a reel</button></div></div>`;return}
  feed.innerHTML=S.list.map((r,i)=>slideHTML(r,i)).join('');
  io&&io.disconnect();
  io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting&&e.intersectionRatio>.6)activate(+e.target.dataset.i)},{root:feed,threshold:[.6]});
  $$('.slide',feed).forEach(s=>io.observe(s));
  let start=0;
  if(first){const q=new URLSearchParams(location.search).get('r');const k=q?S.list.findIndex(r=>r.id===q):-1;if(k>0)start=k}
  feed.scrollTop=start*feed.clientHeight;S.cur=-1;activate(start);
}
function slideHTML(r,i){
  const lk=S.likes[r.id]||{n:0,liked:false},rt=rating(r.shop),biz=r.role==='business',nm=r.by||r.shop;
  const cm=S.comments[r.id]||0,fol=S.follows.has(slug(r.shop));
  return`<article class="slide paused" data-i="${i}" data-id="${esc(r.id)}">
    <video playsinline loop muted preload="${i<2?'auto':'none'}" ${r.poster?`poster="${esc(r.poster)}"`:''} data-src="${esc(r.src)}"></video>
    <div class="shade"></div><div class="tapzone"></div><div class="pp">${ic('play')}</div>
    <div class="cc" aria-live="polite"></div><div class="hss"></div><div class="ptime"></div>
    <div class="rail">
      <button class="act like ${lk.liked?'liked':''}" data-like aria-label="Like"><span class="ic">${ic('heart')}</span><span class="n">${fmt(lk.n)}</span></button>
      <button class="act" data-cm aria-label="Comments"><span class="ic">${ic('message-circle')}</span><span class="n">${fmt(cm)}</span></button>
      <button class="act" data-tx aria-label="Transcript"><span class="ic">${ic('captions')}</span><span>Script</span></button>
      <button class="act" data-share aria-label="Share"><span class="ic">${ic('send')}</span><span>Share</span></button>
      <button class="act ${S.saved.has(r.id)?'saved':''}" data-save aria-label="Save"><span class="ic">${ic('bookmark')}</span><span>Save</span></button>
      ${r.mine?`<button class="act" data-del aria-label="Delete your reel"><span class="ic">${ic('trash-2')}</span><span>Delete</span></button>`:''}
      <span class="disc" style="background:${hue(r.shop)}">${esc((r.shop||'?')[0].toUpperCase())}</span>
    </div>
    <div class="info">
      <div class="who"><a class="av" href="${prof(r)}" aria-label="${esc(nm)}'s profile" style="background:${hue(nm)}">${r.av?`<img src="${esc(r.av)}" alt="" referrerpolicy="no-referrer">`:esc(nm[0].toUpperCase())}</a><a class="name" href="${prof(r)}">${esc(nm)}</a>
        <span class="badge">${biz?'Shop':'Explorer'}</span>
        ${biz?`<button class="follow ${fol?'on':''}" data-follow>${fol?'Following':'Follow'}</button>`:''}</div>
      ${r.caption?`<p class="cap" data-cap>${esc(r.caption)}</p>`:''}
      <div class="chips">
        ${r.offer?`<a class="chip deal" href="/#deals">${ic('ticket')}<span>${esc(r.offer)}</span></a>`:''}
        ${!biz?`<span class="chip">${ic('map-pin')}<span>${esc(r.shop)}</span></span>`:''}

function activate(i){
  if(i===S.cur||i<0||i>=S.list.length)return;
  const prev=vid(S.cur);if(prev){prev.pause();prev.closest('.slide').classList.remove('playing')}
  S.cur=i;load(i);load(i+1);
  const v=vid(i),sl=v.closest('.slide');v.muted=S.muted;v.currentTime=0;
  play(v);
  if(M){M.animate(sl.querySelectorAll('.info>*'),{opacity:[0,1],y:[14,0]},{delay:M.stagger(.05),duration:.4,ease:[.2,.8,.2,1]});
    M.animate(sl.querySelectorAll('.rail>*'),{opacity:[0,1],x:[12,0]},{delay:M.stagger(.04,{startDelay:.08}),duration:.35})}
  const r=S.list[i];history.replaceState(null,'','/reels?r='+encodeURIComponent(r.id));
  closeCard(false);ccLast='';
  let m=null;getMeta(r).then(x=>{m=x;if(x&&S.cur===i)buildHotspots(sl,x);$('#ccBtn').style.display=x?'':'none'});
  cancelAnimationFrame(raf);const bar=sl.querySelector('.prog i'),knob=sl.querySelector('.knob');
  const tick=()=>{if(v.duration&&!sl.classList.contains('scrub')){const f=v.currentTime/v.duration;bar.style.transform=`scaleX(${f})`;knob.style.left=(f*100)+'%'}frameUI(sl,v,m);raf=requestAnimationFrame(tick)};tick();
}

  if(p&&p.catch)p.catch(()=>{if(!v.muted){v.muted=true;S.muted=true;syncMute();v.play().catch(()=>{sl.classList.add('paused');sl.classList.remove('playing')})}else{sl.classList.add('paused');sl.classList.remove('playing')}})}
function togglePlay(){const v=vid(S.cur);if(!v)return;if(v.paused)play(v);else{v.pause();v.closest('.slide').classList.add('paused');v.closest('.slide').classList.remove('playing')}}

  if(e.target.closest('[data-del]'))return delReel(i);
  const sv=e.target.closest('[data-save]');if(sv){S.saved.has(r.id)?S.saved.delete(r.id):S.saved.add(r.id);store.set('bb_saved',[...S.saved]);sv.classList.toggle('saved');toast(S.saved.has(r.id)?'Saved to this device':'Removed from saved');if(M)M.animate(sv.querySelector('.ic'),{scale:[1,1.25,1]},{duration:.3});return}
  const fb=e.target.closest('[data-follow]');if(fb){const k=slug(r.shop);S.follows.has(k)?S.follows.delete(k):S.follows.add(k);store.set('bb_follows',[...S.follows]);
    $$('.slide').forEach(s=>{const rr=S.list[+s.dataset.i];const f=s.querySelector('[data-follow]');if(f&&slug(rr.shop)===k){f.classList.toggle('on',S.follows.has(k));f.textContent=S.follows.has(k)?'Following':'Follow'}});return}
  if(e.target.closest('[data-cap]')){e.target.closest('[data-cap]').classList.toggle('open');return}
});
let lastTap=0,tapT;
$('#feed').addEventListener('pointerup',e=>{
  if(!e.target.classList.contains('tapzone'))return;if($('.hcard'))return;const sl=e.target.closest('.slide'),i=+sl.dataset.i,now=Date.now();
  if(now-lastTap<280){clearTimeout(tapT);lastTap=0;const b=sl.getBoundingClientRect();burst(sl,e.clientX-b.left,e.clientY-b.top);like(i,true);return}
  lastTap=now;tapT=setTimeout(togglePlay,280);
});
$('#mute').onclick=toggleMute;
$('#up').onclick=()=>go(-1);$('#down').onclick=()=>go(1);
document.addEventListener('click',e=>{if(e.target.closest('[data-post]'))openPost()});
$('#cSend').onclick=sendComment;$('#cInp').addEventListener('keydown',e=>{if(e.key==='Enter')sendComment()});
$('#cList').addEventListener('click',async e=>{const d=e.target.closest('[data-delc]');if(!d||!cmFor)return;
  try{const j=await api('/reels/'+encodeURIComponent(cmFor.id)+'/comments/'+d.dataset.delc,null,'DELETE');S.comments[cmFor.id]=j.n;paintCount(cmFor.id);
    paintComments((await api('/reels/'+encodeURIComponent(cmFor.id)+'/comments')).comments)}catch(err){toast(err.message)}});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(e.key==='Escape')return closeSheets();
  if($('.sheet.show'))return;
  if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();go(1)}
  else if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();go(-1)}
  else if(e.key===' '){e.preventDefault();togglePlay()}
  else if(e.key==='m')toggleMute();
  else if(e.key==='c')$('#ccBtn').click();
  else if(e.key==='l')like(S.cur);
});
document.addEventListener('visibilitychange',()=>{const v=vid(S.cur);if(!v)return;if(document.hidden)v.pause();else if(!v.closest('.slide').classList.contains('paused'))v.play().catch(()=>{})});
addEventListener('resize',()=>{const f=$('#feed');f.scrollTop=S.cur*f.clientHeight});

/* tabs */
function setTab(){$$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.f===S.filter));const on=$('.tab.on'),p=$('#pill');p.style.left=on.offsetLeft+'px';p.style.width=on.offsetWidth+'px'}
$('#tabs').onclick=e=>{const t=e.target.closest('.tab');if(!t||t.dataset.f===S.filter)return;S.filter=t.dataset.f;setTab();
  const v=vid(S.cur);if(v)v.pause();build();if(M)M.animate('#feed',{opacity:[.3,1]},{duration:.3})};

syncMute();setTab();document.fonts&&document.fonts.ready.then(setTab);
const wantPost=new URLSearchParams(location.search).has('post');
boot().then(()=>{showHint();if(wantPost)openPost()});
</script>
</body>
