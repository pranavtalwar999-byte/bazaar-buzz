services:
  - type: web
    name: bazaar-buzz
    runtime: node
    plan: free
    buildCommand: echo "No build needed"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
